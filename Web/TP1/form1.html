<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>
  <form>

    <fieldset>
      <legend>Coordonnées</legend>

      <label>Champs de texte</label>
      <input type="text" placeholder="Saisir un mot">
      <br><br>

      <label>URL</label>
      <input type="url" placeholder="Saisir une URL">
      <br><br>

      <label>E-mail</label>
      <input type="email" placeholder="Adresse mail">
      <br><br>

      <label>Un nombre</label>
      <input type="number">
      <br><br>

      <label>Date</label>
      <input type="date">
      <br><br>

      <label>Couleur</label>
      <input type="color">
      <br><br>

      <label>Fichier</label>
      <input type="file">

    </fieldset>

    <br>

    <input type="reset" value="Effacer">
    <input type="submit" value="Envoyer">

  </form> 
  </body>
</html>
