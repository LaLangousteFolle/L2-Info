<!DOCTYPE html>
<html lang="en">
  <head>

    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>
    <h1>Dresseur de pokémon</h1>

  <form>

    <fieldset>
      <legend>Nouveau dresseur</legend>

      <label>Nom</label>
      <br>
      <input type="text">
      <br><br>

      <label>Description</label>
      <br>
      <textarea></textarea>
      <br><br>

      <label>Équipe</label>
      <br>

      <input type="radio" name="equipe" value="rouge">
      <label>Rouge</label>
      <br>

      <input type="radio" name="equipe" value="jaune">
      <label>Jaune</label>
      <br>

      <input type="radio" name="equipe" value="bleu">
      <label>Bleu</label>
      <br><br>

      <label>Anniversaire *</label>
      <br>
      <input type="date" required>
      <br><br>

      <input type="submit" value="Envoyer">

    </fieldset>

  </form>
  
  </body>
